name: Docker build validation

on:
  pull_request:

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Assert BuildKit cache mounts
        run: |
          grep -F -- '--mount=type=cache,target=/usr/local/cargo/registry' Dockerfile
          grep -F -- '--mount=type=cache,target=/usr/local/cargo/git' Dockerfile
          grep -F -- '--mount=type=cache,target=/src/target' Dockerfile
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
