name: Premerge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: 0 0 1 * *

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout source
        uses: actions/checkout@v5

      - name: install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.0

      - name: check
        run: cargo check

      - name: install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: install badge reference
        run: bun install --cwd tools/badge-parity --frozen-lockfile

      - name: test
        run: cargo test

      - name: upload badge parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badge-parity-report
          path: target/badge-parity/
          if-no-files-found: warn

  linting:
    if: ${{ github.ref != 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout source
        uses: actions/checkout@v5

      - name: install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.0
        with:
          components: rustfmt,clippy

      - name: format
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -- -D warnings
